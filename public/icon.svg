<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Camera Body & Lens icon -->
  <g filter="url(#glow)">
    <!-- Main Video Camera Body -->
    <rect x="120" y="166" width="180" height="180" rx="36" fill="url(#camGrad)" />
    
    <!-- Camera Side Lens / Projection -->
    <path d="M312 216 L400 162 C408 157 416 163 416 172 L416 340 C416 349 408 355 400 350 L312 296 Z" fill="url(#camGrad)" />
    
    <!-- Center Audio / Live Pulse Ring -->
    <circle cx="210" cy="256" r="42" fill="#4338ca" />
    <circle cx="210" cy="256" r="22" fill="#ffffff" />
    
    <!-- Live Green Indicator Dot -->
    <circle cx="160" cy="206" r="10" fill="#10b981" />
  </g>

  <!-- Sound / Connection Wave Arc -->
  <path d="M 120 380 Q 256 420 392 380" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
